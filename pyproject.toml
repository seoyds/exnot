[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exnot"
version = "0.1.0"
description = "US Options Exchange Fee Schedule Normalizer & Change Notifier"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    # Task queue
    "celery[redis]>=5.4.0",
    # Redis
    "redis>=5.2.0",
    # HTTP client
    "httpx>=0.28.0",
    # HTML parsing
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    # PDF processing
    "pymupdf>=1.25.0",
    "pdfplumber>=0.11.0",
    # Browser automation
    "playwright>=1.49.0",
    # AI/LLM
    "anthropic>=0.40.0",
    # Configuration
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Email
    "aiosmtplib>=3.0.0",
    # Templating
    "jinja2>=3.1.0",
    # Logging
    "structlog>=24.4.0",
    # Utilities
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "factory-boy>=3.3.0",
    "httpx",
    "ruff>=0.8.0",
    "vcrpy>=6.0.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP042", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring database",
    "e2e: End-to-end tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/exnot"]
